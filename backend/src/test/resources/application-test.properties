# =============================================================================
# Propiedades de prueba de integración — perfil "test"
# =============================================================================
# Las propiedades de DataSource (URL, usuario, contraseña) NO se definen aquí.
# Las inyecta @DynamicPropertySource desde el contenedor Testcontainers en cada
# clase IT que lo necesite. Definirlas aquí crearía conflictos de precedencia.
#
# Spring Boot carga este archivo junto con application.properties cuando
# @ActiveProfiles("test") está activo. Las propiedades aquí complementan (no
# reemplazan) las de application.properties.
# =============================================================================

# Flyway: mismo comportamiento que producción
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

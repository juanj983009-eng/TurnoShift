# Perfil de desarrollo local (HTTP) — activar con: spring.profiles.active=local
# O con variable de entorno: SPRING_PROFILES_ACTIVE=local
#
# ADVERTENCIA: Este perfil deshabilita Secure en la cookie de sesión.
# Usar EXCLUSIVAMENTE en desarrollo local con HTTP (sin TLS).
# NUNCA activar en staging, producción ni cualquier entorno con datos reales.
# El valor seguro predeterminado (Secure=true) está en application.properties.

# Permite cookie de sesión sobre HTTP en entorno local de desarrollo.
server.servlet.session.cookie.secure=false

turnoshift.auth.initial-setup-base-url=http://localhost:5173/setup

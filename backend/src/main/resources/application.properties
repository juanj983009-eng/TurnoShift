spring.application.name=turnoshift-backend
server.port=8081

# =============================================================================
# DataSource — configuración externa requerida
# =============================================================================
# Proporcionar las siguientes variables de entorno antes de arrancar.
# Spring Boot NO lee archivos .env automáticamente.
# Usar: export TURNOSHIFT_DB_URL=... (Linux/Mac) o
#       set TURNOSHIFT_DB_URL=...     (Windows CMD) o
#       $env:TURNOSHIFT_DB_URL=...    (PowerShell)
#
# Si alguna variable está ausente, el contexto de aplicación fallará al arrancar
# con un error claro de tipo MissingRequiredPropertiesException o similar.
#
# Formato esperado de URL:
#   jdbc:sqlserver://localhost:1433;databaseName=turnoshift_dev;encrypt=false
#
# El valor por defecto ':MISSING' produce un error claro de conexión en producción si
# la variable de entorno no está configurada. En pruebas, @DynamicPropertySource
# sobreescribe estas propiedades con la URL del contenedor Testcontainers, con mayor
# prioridad que application.properties.
spring.datasource.url=${TURNOSHIFT_DB_URL:MISSING_TURNOSHIFT_DB_URL}
spring.datasource.username=${TURNOSHIFT_DB_USER:MISSING_TURNOSHIFT_DB_USER}
spring.datasource.password=${TURNOSHIFT_DB_PASSWORD:MISSING_TURNOSHIFT_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =============================================================================
# Flyway — integración automática con Spring Boot
# =============================================================================
# Spring Boot detecta Flyway en el classpath y lo ejecuta al arrancar.
# Las migraciones se leen de classpath:db/migration/ (por defecto).
# NO invocar Flyway.configure() desde el código de aplicación.

# Deshabilitar clean() — NUNCA permitir eliminar el esquema completo en ejecución.
spring.flyway.clean-disabled=true

# Ubicación de migraciones de producción
spring.flyway.locations=classpath:db/migration

# Validar migraciones aplicadas al arrancar (Nota 06, §14: "El esquema se valida al iniciar")
spring.flyway.validate-on-migrate=true

# =============================================================================
# JPA / Hibernate — deshabilitado en esta etapa (I0)
# =============================================================================
# Sin JPA configurado en I0. Cuando se añada, ddl-auto debe ser 'validate' o 'none'.
# NO usar create, create-drop ni update (Nota 06, §14: "No se utilizará actualización
# automática de Hibernate en producción").
# spring.jpa.hibernate.ddl-auto=validate

# =============================================================================
# Spring Security — sin usuario predeterminado
# =============================================================================
# UserDetailsServiceAutoConfiguration está excluido en @SpringBootApplication
# (org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration).
# No se genera contraseña aleatoria en arranque. No hay InMemoryUserDetailsManager.
# La autenticación de usuarios empresariales se implementa en I1 (pendiente).

# =============================================================================
# Spring Session JDBC
# =============================================================================
# Flyway gestiona el esquema (V9). Spring Session NO debe inicializar tablas.
spring.session.jdbc.initialize-schema=never

# Tiempo de inactividad máxima: 30 minutos (Nota 06, §12.2 y openapi.yaml).
# El límite absoluto de 8 horas se implementará en el login real usando
# un atributo authenticatedAt en la sesión (pendiente de I1 autenticación).
spring.session.timeout=1800s

# =============================================================================
# Cookie de sesión
# =============================================================================
# Nombre propio para distinguirla de JSESSIONID genérico.
server.servlet.session.cookie.name=TSESSIONID

# HttpOnly: inaccesible para JavaScript del cliente (previene robo por XSS).
server.servlet.session.cookie.http-only=true

# SameSite=Lax: protección CSRF en navegación normal; permite GET cross-site.
server.servlet.session.cookie.same-site=lax

# Secure=true por defecto: solo se envía sobre HTTPS.
# Para desarrollo HTTP local, usar el perfil 'local' o la variable de entorno
# TURNOSHIFT_COOKIE_SECURE=false (ver application-local.properties).
server.servlet.session.cookie.secure=true

# Path=/api: la cookie solo se envía con rutas bajo /api.
# Limita la exposición de la cookie a las peticiones relevantes del backend.
server.servlet.session.cookie.path=/api

# Sin Domain: la cookie es host-only (no se envía a subdominios).
# No establecer server.servlet.session.cookie.domain

# Sin Max-Age persistente: la cookie es de sesión del navegador (se elimina al cerrar).
# No establecer server.servlet.session.cookie.max-age

# URL rewriting deshabilitado: no añadir jsessionid a URLs.
server.servlet.session.tracking-modes=COOKIE

# =============================================================================
# Password Blocklist — Have I Been Pwned k-anonymity API
# =============================================================================
# Protocolo k-anonymity: solo envía los primeros 5 caracteres hexadecimales del SHA-1.
# Cabecera Add-Padding: true y timeout explícito. Dependencia externa temporal para el MVP.
turnoshift.security.password-blocklist.hibp.url=https://api.pwnedpasswords.com/range/
turnoshift.security.password-blocklist.hibp.timeout-ms=2000
turnoshift.security.password-blocklist.hibp.user-agent=TurnoShift/0.1


# =============================================================================
# Bootstrap del primer operador de plataforma — DESACTIVADO por defecto
# =============================================================================
# Para activar, establecer SOLO en entornos controlados con las variables de
# entorno requeridas: TURNOSHIFT_OPERATOR_EMAIL, TURNOSHIFT_OPERATOR_DISPLAY_NAME,
# TURNOSHIFT_OPERATOR_PASSWORD. Nunca activar en produccion sin esas variables.
turnoshift.operator.bootstrap.enabled=false

# =============================================================================
# Configuración de enlaces de autenticación y acceso inicial
# =============================================================================
turnoshift.auth.initial-setup-base-url=https://app.turnoshift.example/setup


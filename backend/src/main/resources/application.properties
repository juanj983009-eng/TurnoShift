spring.application.name=turnoshift-backend
server.port=8081

# =============================================================================
# DataSource — configuración externa requerida
# =============================================================================
# Proporcionar las siguientes variables de entorno antes de arrancar.
# Spring Boot NO lee archivos .env automáticamente.
# Usar: export TURNOSHIFT_DB_URL=... (Linux/Mac) o
#       set TURNOSHIFT_DB_URL=...     (Windows CMD) o
#       $env:TURNOSHIFT_DB_URL=...    (PowerShell)
#
# Si alguna variable está ausente, el contexto de aplicación fallará al arrancar
# con un error claro de tipo MissingRequiredPropertiesException o similar.
#
# Formato esperado de URL:
#   jdbc:sqlserver://localhost:1433;databaseName=turnoshift_dev;encrypt=false
#
# El valor por defecto ':MISSING' produce un error claro de conexión en producción si
# la variable de entorno no está configurada. En pruebas, @DynamicPropertySource
# sobreescribe estas propiedades con la URL del contenedor Testcontainers, con mayor
# prioridad que application.properties.
spring.datasource.url=${TURNOSHIFT_DB_URL:MISSING_TURNOSHIFT_DB_URL}
spring.datasource.username=${TURNOSHIFT_DB_USER:MISSING_TURNOSHIFT_DB_USER}
spring.datasource.password=${TURNOSHIFT_DB_PASSWORD:MISSING_TURNOSHIFT_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =============================================================================
# Flyway — integración automática con Spring Boot
# =============================================================================
# Spring Boot detecta Flyway en el classpath y lo ejecuta al arrancar.
# Las migraciones se leen de classpath:db/migration/ (por defecto).
# NO invocar Flyway.configure() desde el código de aplicación.

# Deshabilitar clean() — NUNCA permitir eliminar el esquema completo en ejecución.
spring.flyway.clean-disabled=true

# Ubicación de migraciones de producción
spring.flyway.locations=classpath:db/migration

# Validar migraciones aplicadas al arrancar (Nota 06, §14: "El esquema se valida al iniciar")
spring.flyway.validate-on-migrate=true

# =============================================================================
# JPA / Hibernate — deshabilitado en esta etapa (I0)
# =============================================================================
# Sin JPA configurado en I0. Cuando se añada, ddl-auto debe ser 'validate' o 'none'.
# NO usar create, create-drop ni update (Nota 06, §14: "No se utilizará actualización
# automática de Hibernate en producción").
# spring.jpa.hibernate.ddl-auto=validate

                type: "/problems/validation-failed"
                title: "Error de validación"
                status: 400
                detail: "El motivo de activación es obligatorio"
                code: "REASON_REQUIRED"
                requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                errors: []
            invalidValidationFingerprint:
              summary: Huella de validación inválida o discrepante
              value:
                type: "/problems/validation-failed"
                title: "Error de validación"
                status: 400
                detail: "La huella de validación proporcionada no coincide con la propuesta calculada"

                        createdByUserId: "a1f7b0a0-0000-0000-0000-000000000001"
                      - id: "c1f7b0a0-0000-0000-0000-000000000001"
                        versionNumber: 1
                        minimumRestMinutes: 660
                        weeklyWarningMinutes: 2400
                        effectiveAt: "2026-09-24T23:35:00.000Z"
                        changeReason: "Configuración inicial de parámetros operativos para el piloto"
                        createdByUserId: "a1f7b0a0-0000-0000-0000-000000000001"
                emptyHistory:
                  summary: Sin versiones activadas
                  value:
                    items: []
        "401":
          $ref: "#/components/responses/I23SessionRequired"
        "403":
          $ref: "#/components/responses/I23AccessDeniedOrCsrf"
        "503":
          $ref: "#/components/responses/I23ServiceUnavailable"


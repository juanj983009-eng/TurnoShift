        Devuelve el historial completo de versiones de política operativa de la organización
        en orden descendente determinista por `versionNumber` (la versión más reciente primero).
        Si no existen versiones activadas, responde HTTP 200 con `{"items": []}`.

        **Actor:** Usuario empresarial con rol `ADMINISTRADOR` o `SUPERVISOR`.
        Roles `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Aislamiento multi-tenant:** La organización se deriva exclusivamente de la sesión
        en el servidor.
      tags: [policies]
      security:
        - sessionCookie: []
      responses:

    UnavailabilityBadRequest:
      description: |
        `400` — Error en los datos de la petición:
        - `VALIDATION_FAILED`: formato JSON inválido, campos temporales ambiguos o mutuamente excluyentes, motivo no reconocido, o identificadores inválidos.
        - `PAST_INTERVAL_MODIFICATION_PROHIBITED`: el intervalo ya ha iniciado (en modificación o cancelación según RN-013) o se encuentra en un periodo ya finalizado (en registro).
      headers:
        Cache-Control:
          schema:
            type: string
            example: "no-store"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            validationFailed:
              summary: Formato o datos temporales inválidos
              value:
                type: "/problems/validation-failed"
                title: "Error de validación"
                status: 400
                detail: "Debe especificar o bien el rango de horas UTC ('startsAt' y 'endsAt') o bien día completo ('allDay: true' con 'startDate' y 'endDate'), pero no ambos."
                code: "VALIDATION_FAILED"
                requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                errors: []
            pastIntervalProhibited:
              summary: Periodo ya iniciado o finalizado prohibido

      operationId: getCurrentPolicy
      summary: Consultar la política operativa vigente de la organización
      description: |
        Devuelve la versión de política operativa actualmente vigente en la organización
        del usuario autenticado. Si la organización aún no tiene ninguna versión configurada,
        responde HTTP 200 con `{"policy": null}` (estado válido y conocido, no es un 404).

        **Actor:** Usuario empresarial con rol `ADMINISTRADOR` o `SUPERVISOR`.
        Roles `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Aislamiento multi-tenant:** La organización se deriva exclusivamente de la sesión
        en el servidor.
      tags: [policies]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Consulta exitosa de la política vigente.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentPolicyResponse"
              examples:
                withPolicy:
                  summary: Con política vigente configurada
                  value:
                    policy:
                      id: "c1f7b0a0-0000-0000-0000-000000000001"
                      versionNumber: 1
                      minimumRestMinutes: 660
                      weeklyWarningMinutes: 2400
                      effectiveAt: "2026-09-24T23:35:00.000Z"
                      changeReason: "Configuración inicial de parámetros operativos para el piloto"
                      createdByUserId: "a1f7b0a0-0000-0000-0000-000000000001"
                noPolicy:

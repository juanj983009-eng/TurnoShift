            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationView"
        "400":
          $ref: "#/components/responses/I21ValidationFailed"
        "401":
          $ref: "#/components/responses/I21SessionRequired"
        "403":
          $ref: "#/components/responses/I21AccessDeniedOrCsrf"
        "404":
          $ref: "#/components/responses/OrganizationResourceNotFound"
        "409":
          $ref: "#/components/responses/OrganizationConflict"
        "503":
          $ref: "#/components/responses/I21ServiceUnavailable"

  /organization/configuration/active-site/name:
    patch:
      operationId: updateActiveSiteName
      summary: Actualizar nombre de la sede activa
      description: |
        Actualiza el nombre descriptivo de la única sede activa de la organización.
        El código de la sede (`code`) es inmutable y no se puede modificar.

        **Actor:** Requiere rol `ADMINISTRADOR`. Roles `SUPERVISOR` y `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Seguridad:** Requiere cookie de sesión activa y token CSRF en `X-CSRF-TOKEN`.
        **Idempotencia:** Requiere cabecera `Idempotency-Key` (UUID). Ejecución idempotente con
        replays deterministas que retornan `Idempotency-Replayed: true`.

        **Control de concurrencia optimista:** Requiere `expectedLockVersion` (mayor o igual a 0).
        Si la versión enviada no coincide con la versión actual de la sede,
        responde `409 CONCURRENT_MODIFICATION`.
        Tras una actualización exitosa, el `lockVersion` de la sede se incrementa en 1.

        **Respuesta:** Devuelve la vista actualizada de la sede activa (`ActiveSiteView`).
      tags: [organization]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"

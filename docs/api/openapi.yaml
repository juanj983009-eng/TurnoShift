    I23PolicyActivateValidationFailed:
      description: |
        `400` — Error de validación estructural, motivo ausente o huella inválida:
        - `VALIDATION_FAILED`: cuerpo JSON inválido, formato incorrecto, o valores fuera de rango.
        - `REASON_REQUIRED`: el motivo de activación es obligatorio, supera 500 caracteres o contiene únicamente espacios en blanco.
        - `INVALID_VALIDATION_FINGERPRINT`: la huella de validación es obligatoria, no cumple el patrón `^[0-9a-f]{64}$`, o no coincide con los parámetros esperados.
      headers:
        Cache-Control:
          schema:
            type: string
            example: "no-store"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            validationFailed:
              summary: Error de validación estructural o de umbrales
              value:
                type: "/problems/validation-failed"
                title: "Error de validación"
                status: 400
                detail: "El descanso mínimo debe estar entre 1 y 1440 minutos"
                code: "VALIDATION_FAILED"
                requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                errors: []
            reasonRequired:
              summary: Motivo de activación obligatorio o inválido

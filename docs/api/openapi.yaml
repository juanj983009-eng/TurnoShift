          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationConfigurationResponse"
        "401":
          $ref: "#/components/responses/I21SessionRequired"
        "403":
          $ref: "#/components/responses/I21AccessDeniedOrCsrf"
        "404":

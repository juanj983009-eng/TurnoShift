  # -- EMPLOYEES (HU-07) -----------------------------------------------------
  /employees:
    get:
      operationId: getEmployees
      summary: Consultar colaboradores de la organización
      description: |
        Devuelve la lista de colaboradores registrados en la organización a la que
        pertenece el usuario autenticado.

        **Actor:** Usuario empresarial autenticado con rol `ADMINISTRADOR` o `SUPERVISOR`.
        Usuarios con rol `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Aislamiento multi-tenant:** La organización se deriva exclusivamente de la sesión
        activa en el servidor. Nunca se recibe `organizationId` por el cliente.

        **Filtro por estado:** Mediante el parámetro opcional `active`:
        - Si se omite: devuelve todos los colaboradores de la organización (activos e inactivos).
        - `active=true`: solo colaboradores activos.
        - `active=false`: solo colaboradores inactivos.
        - Si se envía vacío, solo con espacios o con cualquier otro valor, responde `400 VALIDATION_FAILED`.
      tags: [employees]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/EmployeeActiveQuery"
      responses:
        "200":
          description: Lista de colaboradores obtenida con éxito. Si no existen colaboradores, devuelve un arreglo vacío `[]`.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/I22ValidationFailed"
        "401":
          $ref: "#/components/responses/I22SessionRequired"
        "403":
          $ref: "#/components/responses/I22AccessDeniedOrCsrf"
        "503":
          $ref: "#/components/responses/I22ServiceUnavailable"

    post:
      operationId: createEmployee
      summary: Registrar un nuevo colaborador
      description: |
        Registra un nuevo colaborador dentro de la organización del usuario autenticado.
        El colaborador se vincula automáticamente a la sede activa única de la organización
        y se inicializa en estado activo (`active: true`) con `lockVersion: 0`.

        **Actor:** Requiere rol `ADMINISTRADOR`. Roles `SUPERVISOR` y `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Seguridad:** Requiere cookie de sesión activa y token CSRF en `X-CSRF-TOKEN`.
        **Idempotencia:** Requiere cabecera `Idempotency-Key` (UUID). Ejecución coordinada
        mediante `BusinessIdempotentOperationExecutor`. Replays deterministas devuelven
        la respuesta original con la cabecera `Idempotency-Replayed: true`.

        **Reglas de validación y de negocio:**
        - `code`: obligatorio, alfanumérico con guiones (`^[A-Z0-9-]+$`), entre 2 y 32 caracteres.
          Se normaliza a mayúsculas. Debe ser único dentro de la organización. Si ya existe,
          responde `409 EMPLOYEE_CODE_ALREADY_EXISTS`.
        - `displayName`: obligatorio, texto limpio de 1 a 100 caracteres.
        - `positionId`: UUID obligatorio de un puesto de trabajo existente en la organización.
          Si el puesto no existe, responde `404 POSITION_NOT_FOUND`.
          Si el puesto existe pero se encuentra inactivo, responde `409 POSITION_INACTIVE`.
        - Sede activa: la organización debe tener exactamente una sede activa. Si no existe,
          responde `409 NO_ACTIVE_SITE`.
        - Capacidad de licencia: la cantidad de colaboradores activos no puede superar el límite
          contratado (`max_active_employees`). Si se supera, responde `409 EMPLOYEE_LICENSE_LIMIT_REACHED`.
      tags: [employees]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Colaborador registrado exitosamente.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/I22ValidationFailed"
        "401":
          $ref: "#/components/responses/I22SessionRequired"
        "403":
          $ref: "#/components/responses/I22AccessDeniedOrCsrf"
        "404":
          $ref: "#/components/responses/PositionNotFound"
        "409":
          $ref: "#/components/responses/EmployeeCreationConflict"
        "503":
          $ref: "#/components/responses/I22ServiceUnavailable"

  /employees/{employeeId}:
    get:
      operationId: getEmployee
      summary: Consultar un colaborador por ID
      description: |
        Devuelve el detalle de un colaborador específico por su identificador único dentro
        de la organización del usuario autenticado.

        **Actor:** Usuario empresarial autenticado con rol `ADMINISTRADOR` o `SUPERVISOR`.
        Usuarios con rol `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Aislamiento multi-tenant:** Si el colaborador existe en otra organización o no existe,
        devuelve `404 EMPLOYEE_NOT_FOUND`.
      tags: [employees]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
      responses:
        "200":
          description: Detalle del colaborador obtenido con éxito.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/I22ValidationFailed"
        "401":
          $ref: "#/components/responses/I22SessionRequired"
        "403":
          $ref: "#/components/responses/I22AccessDeniedOrCsrf"
        "404":
          $ref: "#/components/responses/EmployeeNotFound"
        "503":
          $ref: "#/components/responses/I22ServiceUnavailable"

    patch:
      operationId: updateEmployee
      summary: Modificar datos de un colaborador
      description: |
        Modifica los campos mutables de un colaborador: `displayName`, `positionId` o ambos.
        Los campos `code` y `siteId` son inmutables.

        **Actor:** Requiere rol `ADMINISTRADOR`. Roles `SUPERVISOR` y `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Seguridad:** Requiere cookie de sesión activa y token CSRF en `X-CSRF-TOKEN`.
        **Idempotencia:** Requiere cabecera `Idempotency-Key` (UUID). Replays deterministas retornan
        `Idempotency-Replayed: true`.

        **Control de concurrencia optimista:** Requiere `expectedLockVersion` (mayor o igual a 0).
        Si la versión enviada no coincide con la versión actual en la base de datos,
        la operación se rechaza con `409 CONCURRENT_MODIFICATION`.
        Tras una modificación exitosa, el `lockVersion` del colaborador se incrementa en 1.

        **Reglas de validación:**
        - Al menos `displayName` o `positionId` debe estar presente en el cuerpo de la petición.
        - Si se actualiza `displayName`, debe cumplir con longitud de 1 a 100 caracteres y formato limpio.
        - Si se actualiza `positionId`, el nuevo puesto debe existir (`404 POSITION_NOT_FOUND`) y estar activo (`409 POSITION_INACTIVE`).
      tags: [employees]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
        - $ref: "#/components/parameters/CsrfTokenHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Colaborador actualizado exitosamente.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/I22ValidationFailed"
        "401":
          $ref: "#/components/responses/I22SessionRequired"
        "403":
          $ref: "#/components/responses/I22AccessDeniedOrCsrf"
        "404":
          description: |
            `404` — Colaborador o puesto no encontrado:
            - `EMPLOYEE_NOT_FOUND`: el colaborador solicitado no existe o no pertenece a la organización.
            - `POSITION_NOT_FOUND`: el puesto indicado en `positionId` no existe en la organización.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                employeeNotFound:
                  summary: Colaborador no encontrado
                  value:
                    type: "/problems/employee-not-found"
                    title: "Colaborador no encontrado"
                    status: 404
                    detail: "El colaborador solicitado no existe o no pertenece a la organización."
                    code: "EMPLOYEE_NOT_FOUND"
                    requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                    errors: []
                positionNotFound:
                  summary: Puesto no encontrado
                  value:
                    type: "/problems/position-not-found"
                    title: "Puesto no encontrado"
                    status: 404
                    detail: "El puesto especificado no existe en la organización."
                    code: "POSITION_NOT_FOUND"
                    requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                    errors: []
        "409":
          $ref: "#/components/responses/EmployeeMutationConflict"
        "503":
          $ref: "#/components/responses/I22ServiceUnavailable"

  /employees/{employeeId}/activate:
    post:
      operationId: activateEmployee
      summary: Activar un colaborador
      description: |
        Pasa al colaborador al estado activo (`active: true`).
        Si el colaborador ya se encuentra en estado activo, la operación es un no-op válido
        y responde con éxito (`200 OK`) devolviendo la representación actual sin alterar el `lockVersion`.

        **Actor:** Requiere rol `ADMINISTRADOR`. Roles `SUPERVISOR` y `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Seguridad:** Requiere cookie de sesión activa y token CSRF en `X-CSRF-TOKEN`.
        **Idempotencia:** Requiere cabecera `Idempotency-Key` (UUID). Replays deterministas retornan
        `Idempotency-Replayed: true`.

        **Control de concurrencia optimista:** Requiere `expectedLockVersion` (mayor o igual a 0).
        Si la versión enviada no coincide con la versión actual en la base de datos,
        la operación se rechaza con `409 CONCURRENT_MODIFICATION`.
        Tras una activación con transición de estado efectiva, el `lockVersion` se incrementa en 1.

        **Capacidad de licencia:** Requiere adquirir el bloqueo de licencia a nivel de organización
        y verificar que no se sobrepase el límite contratado (`max_active_employees`).
        Si se sobrepasa, responde `409 EMPLOYEE_LICENSE_LIMIT_REACHED`.
      tags: [employees]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
        - $ref: "#/components/parameters/CsrfTokenHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmployeeStatusRequest"
      responses:
        "200":
          description: Colaborador activado exitosamente (o ya se encontraba activo).
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/I22ValidationFailed"
        "401":
          $ref: "#/components/responses/I22SessionRequired"
        "403":
          $ref: "#/components/responses/I22AccessDeniedOrCsrf"
        "404":
          $ref: "#/components/responses/EmployeeNotFound"
        "409":
          $ref: "#/components/responses/EmployeeActivateConflict"
        "503":
          $ref: "#/components/responses/I22ServiceUnavailable"

  /employees/{employeeId}/deactivate:
    post:
      operationId: deactivateEmployee
      summary: Desactivar un colaborador
      description: |
        Pasa al colaborador al estado inactivo (`active: false`).
        Si el colaborador ya se encuentra en estado inactivo, la operación es un no-op válido
        y responde con éxito (`200 OK`) devolviendo la representación actual sin alterar el `lockVersion`.

        **Actor:** Requiere rol `ADMINISTRADOR`. Roles `SUPERVISOR` y `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Seguridad:** Requiere cookie de sesión activa y token CSRF en `X-CSRF-TOKEN`.
        **Idempotencia:** Requiere cabecera `Idempotency-Key` (UUID). Replays deterministas retornan
        `Idempotency-Replayed: true`.

        **Control de concurrencia optimista:** Requiere `expectedLockVersion` (mayor o igual a 0).
        Si la versión enviada no coincide con la versión actual en la base de datos,
        la operación se rechaza con `409 CONCURRENT_MODIFICATION`.
        Tras una desactivación con transición de estado efectiva, el `lockVersion` se incrementa en 1.
      tags: [employees]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
        - $ref: "#/components/parameters/CsrfTokenHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmployeeStatusRequest"
      responses:
        "200":
          description: Colaborador desactivado exitosamente (o ya se encontraba inactivo).
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/I22ValidationFailed"
        "401":
          $ref: "#/components/responses/I22SessionRequired"
        "403":
          $ref: "#/components/responses/I22AccessDeniedOrCsrf"
        "404":
          $ref: "#/components/responses/EmployeeNotFound"
        "409":
          $ref: "#/components/responses/EmployeeDeactivateConflict"
        "503":
          $ref: "#/components/responses/I22ServiceUnavailable"

  /employees/{employeeId}/deactivation-preview:
    post:
      operationId: previewEmployeeDeactivation
      summary: Evaluar precondiciones para desactivación de un colaborador
      description: |
        Evalúa si un colaborador puede ser desactivado de manera segura o si existen bloqueos
        operativos o contractuales. No realiza ninguna mutación en la base de datos.

        **Actor:** Requiere rol `ADMINISTRADOR`. Roles `SUPERVISOR` y `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Seguridad:** Requiere cookie de sesión activa y token CSRF en `X-CSRF-TOKEN`.
        **Sin idempotencia:** Dado que es una operación de consulta y evaluación sin efectos
        colaterales de negocio, no requiere ni admite cabecera `Idempotency-Key` ni cuerpo de petición.
      tags: [employees]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
        - $ref: "#/components/parameters/CsrfTokenHeader"
      responses:
        "200":
          description: Precondiciones de desactivación evaluadas exitosamente.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeactivationPreviewResponse"
        "400":
          $ref: "#/components/responses/I22ValidationFailed"
        "401":
          $ref: "#/components/responses/I22SessionRequired"
        "403":
          $ref: "#/components/responses/I22AccessDeniedOrCsrf"
        "404":
          $ref: "#/components/responses/EmployeeNotFound"
        "503":
          $ref: "#/components/responses/I22ServiceUnavailable"

  # -- POLICIES (I2.3) -------------------------------------------------------
  /policies/current:

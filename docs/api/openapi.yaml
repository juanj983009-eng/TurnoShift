              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyHistoryResponse"
              examples:
                withHistory:
                  summary: Con versiones en el historial
                  value:
                    items:
                      - id: "c1f7b0a0-0000-0000-0000-000000000002"
                        versionNumber: 2
                        minimumRestMinutes: 720
                        weeklyWarningMinutes: 2400
                        effectiveAt: "2026-09-25T10:00:00.000Z"

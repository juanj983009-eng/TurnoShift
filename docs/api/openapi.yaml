openapi: "3.1.0"

info:
  title: TurnoShift API — Contrato MVP (I1 + I2.1 + I2.2 + I2.3 + I2.4)
  version: "0.2.4-i2.4"
  description: |
    Contrato HTTP del MVP de TurnoShift.

    **Estado:** contrato consolidado que abarca los endpoints de I1, las rutas implementadas
    de I2.1 (HU-05 y HU-06), la gestión de colaboradores de I2.2 (HU-07), la política operativa
    inicial de I2.3 y las mutaciones de indisponibilidades de I2.4 (HU-08).

    **Alcance de este contrato:**
    - **I1 (Acceso seguro e infraestructura):**
      - Token CSRF y estado de sesión.
      - Inicio y cierre de sesión empresarial.
      - Incorporación de organización + sede + primer administrador, ejecutada por el operador
        de plataforma mediante herramienta restringida (ver nota sobre mecanismo del operador).
      - Emisión del enlace inicial de contraseña para el primer administrador, integrada con HU-01.
      - Establecimiento de contraseña mediante enlace e inspección previa.
      - Endpoint de salud del backend (verificado, fuera del prefijo `/api/v1`).
      - Respuestas de error transversales RFC 9457.
    - **I2.1 (Configuración de organización y catálogo de puestos):**
      - HU-06: Consulta, creación, actualización y cambio de estado de puestos de trabajo.
      - HU-05: Consulta y actualización de configuración general de organización y su sede única activa.
    - **I2.2 (Gestión de colaboradores / empleados):**
      - HU-07: Consulta, registro, modificación, activación, desactivación y evaluación previa de precondiciones de colaboradores.
    - **I2.3 (Política operativa inicial):**
      - Consulta de la política operativa vigente (`GET /policies/current`).
      - Consulta del historial cronológico de versiones de política (`GET /policies/history`).
      - Previsualización determinista del impacto de una propuesta de cambio (`POST /policies/preview`).
      - Activación transaccional e idempotente de una nueva versión de política con bloqueo optimista y por organización (`POST /policies/activate`).
    - **I2.4 (Indisponibilidades de colaboradores — HU-08):**
      - Registro de indisponibilidad parcial o de día completo para un colaborador (`POST /employees/{employeeId}/unavailabilities`).
      - Modificación de indisponibilidad activa con concurrencia optimista (`PUT /unavailabilities/{unavailabilityId}`).
      - Cancelación de indisponibilidad activa con concurrencia optimista (`POST /unavailabilities/{unavailabilityId}/cancel`).

    **Pendiente de decisión — Mecanismo del operador (PROP-OP-01):**
    Las notas de planificación especifican que el alta y la suspensión de organizaciones se
    realizan mediante herramientas restringidas, separadas de la navegación ordinaria del cliente
    (Nota 10, §17.1). `platform_operators` es una entidad distinta de `app_users` y no implica
    construir otro portal público (Nota 07, §6.1).
    Este contrato propone rutas bajo `/operator/*` para describir el comportamiento esperado,
    pendientes de aprobación del mecanismo de autenticación del operador.
    Ver `docs/api/README.md` §Mecanismo del operador.

    **Fuera de este contrato:**
    - Endpoints de I1 no incluidos en el subconjunto inicial: `POST /auth/change-password` (HU-04.2),
      administración de usuarios (HU-03).
    - Endpoints posteriores a I2.4: Contratos y jornadas laborales,
      planificación (I3), intercambios (I4), reportes y avisos (I5+).

    **Convenciones:**
    - Prefijo base de API empresarial: `/api/v1`.
    - Endpoint de salud: `/api/health` (sin prefijo `/v1`; puerto 8081).
    - Formato: `application/json` / `application/problem+json`.
    - Propiedades: inglés, `camelCase`.
    - Mensajes de error: español.
    - Identificadores de negocio: UUID v4 representados como cadenas opacas.
    - Autenticación empresarial: cookie de sesión (`HttpOnly`, `Secure` en producción,
      `SameSite=Lax`). El token de sesión **no** viaja en JSON ni en `Authorization`.
    - La organización y el usuario se derivan **exclusivamente** de la sesión en el servidor;
      no se acepta `organizationId` ni `actorUserId` enviado por el cliente para autorizar operaciones.
    - CSRF: cabecera `X-CSRF-TOKEN` obligatoria para todas las escrituras.
    - Idempotencia: cabecera `Idempotency-Key` (UUID) obligatoria en todos los comandos de negocio
      con soporte para repetición determinista (`Idempotency-Replayed: true`).
    - Concurrencia optimista: parámetro obligatorio `expectedLockVersion` en modificaciones
      de recursos versionados. Si la versión esperada es obsoleta, responde `409 CONCURRENT_MODIFICATION`.

  contact:
    name: TurnoShift — equipo de desarrollo
  license:
    name: Privado
    identifier: LicenseRef-Privado

servers:
  - url: /api/v1
    description: Prefijo de API empresarial (backend puerto 8081)
  - url: /
    description: Raíz del backend — usado solo por el endpoint de salud

# ---------------------------------------------------------------------------
# Tags
# ---------------------------------------------------------------------------
tags:
  - name: infrastructure
    description: Endpoints de infraestructura (salud, CSRF).
  - name: session
    description: Inicio, cierre de sesión y estado de sesión empresarial.
  - name: operator
    description: |
      Operaciones del operador de plataforma mediante herramienta restringida.
      Pendiente de decisión sobre mecanismo de autenticación (PROP-OP-01).
  - name: password-setup
    description: Configuración inicial de contraseña mediante enlace de un solo uso.
  - name: positions
    description: Gestión del catálogo de puestos de trabajo de la organización (HU-06).
  - name: organization
    description: Consulta y actualización de configuración general de organización y sede única activa (HU-05).
  - name: employees
    description: Gestión del catálogo y ciclo de vida de colaboradores de la organización (HU-07).
  - name: policies
    description: Gestión de la política operativa inicial de la organización (I2.3).
  - name: unavailabilities
    description: Gestión de indisponibilidades de colaboradores (HU-08 / I2.4).

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # -- HEALTH ----------------------------------------------------------------
  # Ruta real: /api/health (no bajo /api/v1)
  # Verificada en ejecución: HTTP 200 {"service":"turnoshift-backend","status":"UP"}
  /api/health:
    servers:
      - url: /
        description: Raíz del backend
    get:
      operationId: getHealth
      summary: Estado del servicio backend
      description: |
        Endpoint de salud del backend. No requiere autenticación.
        Ruta real: `http://localhost:8081/api/health`.
        **Verificado en ejecución:** responde HTTP 200 con `{"service":"turnoshift-backend","status":"UP"}`.
        Esta ruta no forma parte del prefijo `/api/v1`.
      tags: [infrastructure]
      security: []
      responses:
        "200":
          description: Servicio operativo.
          content:
            application/json:
              schema:
                type: object
                required: [service, status]
                properties:
                  service:
                    type: string
                    example: "turnoshift-backend"
                  status:
                    type: string
                    example: "UP"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "400":
          $ref: "#/components/responses/ValidationFailed"

  # -- CSRF ------------------------------------------------------------------
  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Obtener token CSRF
      description: |
        Devuelve un token CSRF activo que debe adjuntarse en todas las solicitudes
        de escritura posteriores mediante la cabecera `X-CSRF-TOKEN`.

        Obtener un nuevo token tras iniciar sesión, cerrar sesión o cuando el token
        vigente sea inválido.

        No requiere sesión activa. Sesiones anónimas para CSRF son válidas;
        no representan usuarios empresariales autenticados (Nota 07, §10.1).
      tags: [infrastructure]
      security: []
      responses:
        "200":
          description: Token CSRF generado.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "400":
          $ref: "#/components/responses/ValidationFailed"

  # -- SESSION STATE ---------------------------------------------------------
  /auth/session:
    get:
      operationId: getSessionState
      summary: Consultar identidad y contexto de la sesión activa
      description: |
        Devuelve el usuario y la organización asociados a la sesión en curso.

        Si no existe sesión activa devuelve `401 SESSION_REQUIRED`.
        Usar tras cargar la aplicación para revalidar el estado.

        Este endpoint **no** crea ni renueva una sesión.
        Usar ante respuesta incierta de `POST /auth/login`.
      tags: [session]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Sesión activa; identidad y contexto devueltos.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # -- LOGIN -----------------------------------------------------------------
  /auth/login:
    post:
      operationId: login
      summary: Iniciar sesión
      description: |
        Verifica las credenciales del usuario y, si son válidas, establece una sesión
        en el servidor. La credencial de sesión se entrega mediante cookie; no aparece
        en el cuerpo de la respuesta.

        **Condiciones de rechazo:**
        - Credenciales incorrectas → `401 AUTHENTICATION_FAILED`.
        - Cuenta sin contraseña configurada → `401 AUTHENTICATION_FAILED`
          (no se revela si la cuenta existe ni si tiene contraseña pendiente).
        - Cuenta inactiva → `401 AUTHENTICATION_FAILED`.
        - Organización suspendida → `403 ACCESS_DENIED`.
        - CSRF inválido → `403 CSRF_INVALID`.

        Los errores de acceso no revelan contraseñas ni detalles innecesarios.

        **Respuesta incierta:** consultar `GET /auth/session` antes de reintentar.

        **CSRF:** requiere `X-CSRF-TOKEN` + sesión anónima activa.
        **Idempotencia:** las operaciones de credenciales no utilizan `api_operations`
        (Nota 10, §4.4, §7.5).
      tags: [session]
      security:
        - csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: |
            Sesión iniciada. La cookie de sesión se establece en la respuesta.
            El frontend **no** debe almacenar la credencial en `localStorage`.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Set-Cookie:
              schema:
                type: string
                example: "TSESSIONID=<opaque>; HttpOnly; SameSite=Lax; Path=/api"
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: |
            `401 AUTHENTICATION_FAILED` — Credenciales incorrectas, cuenta inactiva
            o cuenta sin contraseña configurada.
            El mensaje no revela cuál de las condiciones aplica.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "/problems/authentication-failed"
                title: "Autenticación fallida"
                status: 401
                detail: "Las credenciales son incorrectas o la cuenta no puede iniciar sesión."
                code: "AUTHENTICATION_FAILED"
                requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                errors: []
        "403":
          $ref: "#/components/responses/AccessDeniedOrCsrf"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # -- LOGOUT ----------------------------------------------------------------
  /auth/logout:
    post:
      operationId: logout
      summary: Cerrar sesión
      description: |
        Invalida la sesión activa en el servidor y limpia la cookie.

        Si no existe sesión activa devuelve `401 SESSION_REQUIRED`.

        **Respuesta incierta:** comprobar `GET /auth/session` antes de continuar.

        Después del cierre de sesión obtener un nuevo token CSRF.

        **CSRF + sesión:** requiere tanto cookie de sesión activa como `X-CSRF-TOKEN` válido.
      tags: [session]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Cuerpo vacío. El servidor no acepta campos adicionales.
              maxProperties: 0
      responses:
        "204":
          description: Sesión cerrada correctamente. Sin cuerpo de respuesta.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/AccessDeniedOrCsrf"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # -- OPERATOR: AUTHENTICATION & SESSION ------------------------------------
  /operator/auth/login:
    post:
      operationId: operatorLogin
      summary: "[OPERADOR] Iniciar sesión de operador de plataforma"
      description: |
        Verifica las credenciales del operador de plataforma (`email` y `password`)
        y establece una sesión segura mediante cookie `TSESSIONID`.
        No requiere código de organización.

        **Condiciones de rechazo:**
        - Credenciales incorrectas, operador inexistente o inactivo → `401 AUTHENTICATION_FAILED` (indistinguible).
        - CSRF ausente o inválido → `403 CSRF_INVALID`.
        - Tasa de intentos excedida → `429 RATE_LIMITED` con `Retry-After`.
        - Error técnico de base de datos → `503 SERVICE_UNAVAILABLE`.

        **CSRF:** requiere cabecera `X-CSRF-TOKEN` y sesión anónima o previa.
      tags: [operator]
      security:
        - csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorLoginRequest"
      responses:
        "200":
          description: Sesión de operador iniciada. La cookie TSESSIONID se establece en la respuesta.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Set-Cookie:
              schema:
                type: string
                example: "TSESSIONID=<opaque>; HttpOnly; SameSite=Lax; Path=/api"
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/AccessDeniedOrCsrf"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /operator/auth/session:
    get:
      operationId: getOperatorSessionState
      summary: "[OPERADOR] Consultar identidad y contexto de la sesión de operador activa"
      description: |
        Devuelve el identificador y nombre visible del operador de plataforma asociado a la sesión en curso.
        Requiere autoridad `ROLE_PLATFORM_OPERATOR`.

        Si no existe sesión de operador activa o ha vencido, responde `401 SESSION_REQUIRED`.
        Si la petición proviene de un usuario empresarial autenticado, responde `403 ACCESS_DENIED`.
        Este endpoint no crea ni renueva sesiones.
      tags: [operator]
      security:
        - operatorSession: []
      responses:
        "200":
          description: Sesión de operador activa.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSessionResponse"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/AccessDeniedOrCsrf"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /operator/auth/logout:
    post:
      operationId: operatorLogout
      summary: "[OPERADOR] Cerrar sesión de operador"
      description: |
        Invalida la sesión activa del operador de plataforma en el servidor y revoca la cookie `TSESSIONID`.
        Requiere sesión activa de operador (`ROLE_PLATFORM_OPERATOR`) y cabecera `X-CSRF-TOKEN` válida.
      tags: [operator]
      security:
        - operatorSession: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Cuerpo vacío. El servidor no acepta campos adicionales.
              maxProperties: 0
      responses:
        "204":
          description: Sesión de operador cerrada correctamente. Sin cuerpo.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Set-Cookie:
              schema:
                type: string
                example: "TSESSIONID=; Max-Age=0; Path=/api; HttpOnly; SameSite=Lax"
            Cache-Control:
              schema:
                type: string
                example: "no-store"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/AccessDeniedOrCsrf"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # -- OPERATOR: ONBOARDING --------------------------------------------------
  # PROP-OP-01 — Pendiente de aprobación del mecanismo de autenticación del operador.
  # El operador usa herramienta restringida, separada de la aplicación cliente.
  # Estas rutas describen el comportamiento esperado; el mecanismo de auth no está
  # finalizado. Ver docs/api/README.md §Mecanismo del operador.
  /operator/setup/organizations:
    post:
      operationId: incorporateOrganization
      summary: "[OPERADOR] Incorporar una organización con su sede y primer administrador"
      description: |
        Registra una nueva organización, su sede inicial y la cuenta del primer
        administrador en una única operación atómica.

        **Actor:** operador de TurnoShift autenticado mediante herramienta restringida
        de plataforma. No es un endpoint público ni del cliente empresarial.
        El operador no pertenece a una organización cliente (`platform_operators`
        es distinto de `app_users`; Nota 07, §6.1 y §6.3).

        **Comportamiento:**
        - El alta no deja datos parciales ante un fallo transaccional.
        - La organización no queda habilitada para publicar hasta completar la
          configuración operativa requerida (puestos, colaboradores, política).
        - La cuenta del administrador se crea sin contraseña.
        - No se entregan contraseñas predeterminadas compartidas.
        - La organización se identifica internamente; el operador no envía un
          `organizationId` propio para el nuevo inquilino.
        - Se registra la intervención del operador en auditoría con
          `actor_type = PLATFORM_OPERATOR` (Nota 07, §9.1).

        **Idempotencia del alta antes de que exista la organización:**
        La clave de idempotencia está delimitada por la identidad del operador
        y el UUID de intención, no por `organization_id` (que todavía no existe).
        La tabla `api_operations` registra `actor_operator_id` como actor en lugar
        de `actor_user_id` para este comando.

        **Siguiente paso obligatorio:** emitir el enlace inicial del administrador
        mediante `POST /operator/setup/organizations/{id}/initial-access-link`
        antes de entregar el acceso.

        **PROP-OP-01:** El mecanismo de autenticación del operador (sesión propia,
        API key restringida u otro) no está finalizado. Este endpoint está marcado
        como pendiente de revisión. Ver README §Mecanismo del operador.

        **CSRF:** requiere `X-CSRF-TOKEN` (válido también para la herramienta del operador).
        **Idempotencia:** requiere cabecera `Idempotency-Key` (UUID de la intención).
      tags: [operator]
      security:
        - operatorSession: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncorporateOrganizationRequest"
            examples:
              cafedemo:
                summary: "Ejemplo: Café Demo"
                value:
                  organization:
                    code: "CAFE-DEMO"
                    displayName: "Café Demo S.A."
                    timeZone: "America/Lima"
                  site:
                    displayName: "Sede Central Lima"
                  firstAdmin:
                    email: "admin@cafedemo.example"
                    displayName: "Ana García"
      responses:
        "201":
          description: |
            Organización, sede y cuenta de administrador creadas correctamente.
            El administrador todavía no tiene contraseña configurada.
            Emitir el enlace inicial de inmediato con el endpoint siguiente.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Location:
              schema:
                type: string
                format: uri
                example: "http://localhost:8081/api/v1/organizations/6ba7b810-9dad-11d1-80b4-00c04fd430c8"
            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncorporateOrganizationResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/AccessDeniedOrCsrf"
        "409":
          description: |
            Conflicto. Causas posibles:
            - `IDEMPOTENCY_KEY_REUSED`: la clave fue utilizada con contenido diferente.
            - `IDEMPOTENCY_KEY_EXPIRED`: la clave ha superado su periodo de vigencia (24 horas).
            - `ORGANIZATION_CODE_CONFLICT`: el código de organización ya existe.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                idempotencyReused:
                  summary: Clave reutilizada con contenido diferente
                  value:
                    type: "/problems/idempotency-key-reused"
                    title: "Clave de idempotencia reutilizada"
                    status: 409
                    detail: "La clave de idempotencia fue usada previamente con un contenido diferente."
                    code: "IDEMPOTENCY_KEY_REUSED"
                    requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                    errors: []
                idempotencyExpired:
                  summary: Clave de idempotencia expirada
                  value:
                    type: "/problems/idempotency-key-expired"
                    title: "Clave de idempotencia expirada"
                    status: 409
                    detail: "La clave de idempotencia ha superado el periodo de vigencia permitido (24 horas)."
                    code: "IDEMPOTENCY_KEY_EXPIRED"
                    requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                    errors: []
                codeConflict:
                  summary: Código de organización ya existe
                  value:
                    type: "/problems/organization-code-conflict"
                    title: "Código de organización en uso"
                    status: 409
                    detail: "El código 'CAFE-DEMO' ya está asignado a otra organización."
                    code: "ORGANIZATION_CODE_CONFLICT"
                    requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                    errors: []
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # -- OPERATOR: INITIAL ACCESS LINK (HU-04.1 integrado con HU-01) -----------
  /operator/setup/organizations/{organizationId}/initial-access-link:
    post:
      operationId: emitInitialAccessLink
      summary: "[OPERADOR] Emitir enlace inicial de contraseña para el primer administrador"
      description: |
        Emite el enlace de configuración inicial de contraseña para el primer
        administrador de la organización recién incorporada.

        **Integración con HU-01:** Esta acción es parte necesaria del flujo de
        incorporación (HU-04.1 integrado con HU-01). No puede aplazarse a I2,
        porque sin ella el administrador no puede acceder al sistema.

        **Separación de responsabilidades:** Crear la cuenta (`POST /operator/setup/organizations`)
        y emitir el enlace son acciones diferenciadas (HU-04.1, criterio de aceptación).

        **El secreto solo se entrega en la respuesta de este endpoint** al operador
        autorizado. No se almacena en auditoría, logs ni resultados de idempotencia.
        La respuesta debe usar `Cache-Control: no-store`.

        **Propósito:** `INITIAL_SETUP`. Solo aplicable mientras el administrador
        no tenga contraseña configurada.

        **Vencimiento:** propuesto en 30 minutos desde la emisión (pendiente DEC-08).

        **Revocación:** emitir un nuevo enlace revoca el anterior. El enlace anterior
        queda inutilizable aunque no haya vencido.

        **Respuesta incierta del operador:** si se pierde la respuesta, emitir un nuevo
        enlace de forma consciente. El enlace anterior queda revocado; no hay forma de
        recuperar el secreto desde los registros.

        **PROP-OP-01:** Sujeto al mismo mecanismo de autenticación de operador pendiente.

        **CSRF:** requiere `X-CSRF-TOKEN`.
        **Idempotencia:** las operaciones de credenciales no utilizan el registro
        genérico de `api_operations` (no se almacena el secreto en `response_body`).
      tags: [operator]
      security:
        - operatorSession: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: organizationId
          in: path
          required: true
          description: Identificador opaco de la organización recién incorporada.
          schema:
            type: string
            format: uuid
            example: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmitInitialLinkRequest"
      responses:
        "200":
          description: |
            Enlace inicial emitido. El secreto se entrega únicamente en esta respuesta.
            No se almacena en caché ni en registros de auditoría.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmitInitialLinkResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/AccessDeniedOrCsrf"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: |
            Conflicto. Causas posibles:
            - `INVALID_STATE_TRANSITION`: el administrador ya tiene contraseña configurada o la cuenta/organización no está activa.
            - `CONCURRENT_MODIFICATION`: la versión esperada (`expectedVersion`) no coincide con la versión actual del administrador.
            - `INITIAL_LINK_ALREADY_EMITTED`: intento de repetición con la misma clave de idempotencia; el secreto no es almacenable ni reproducible y no se generan enlaces duplicados.
            - `IDEMPOTENCY_KEY_REUSED`: la clave de idempotencia fue reutilizada con una huella de petición diferente.
            - `IDEMPOTENCY_KEY_EXPIRED`: la clave de idempotencia ha superado el periodo de vigencia permitido (24 horas).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                invalidStateTransition:
                  summary: Administrador con contraseña ya configurada
                  value:
                    type: "/problems/invalid-state-transition"
                    title: "Transición de estado inválida"
                    status: 409
                    detail: "El administrador ya tiene contraseña configurada."
                    code: "INVALID_STATE_TRANSITION"
                    requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                    errors: []
                linkAlreadyEmitted:
                  summary: Enlace inicial ya emitido con esta clave de idempotencia
                  value:
                    type: "/problems/initial-link-already-emitted"
                    title: "Enlace inicial ya emitido para esta clave de idempotencia"
                    status: 409
                    detail: "El enlace inicial ya fue emitido para esta clave de idempotencia. Por motivos de seguridad, el secreto no se almacena y no puede ser reproducido. Si perdió la respuesta y necesita un nuevo enlace, emita deliberadamente una nueva solicitud con una nueva cabecera Idempotency-Key y la versión actual del administrador (el enlace anterior quedará revocado)."
                    code: "INITIAL_LINK_ALREADY_EMITTED"
                    requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                    errors: []
                concurrentModification:
                  summary: Conflicto de versión (concurrencia optimista)
                  value:
                    type: "/problems/concurrent-modification"
                    title: "Conflicto de versión del administrador"
                    status: 409
                    detail: "La versión esperada (0) no coincide con la versión actual (1) del administrador."
                    code: "CONCURRENT_MODIFICATION"
                    requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                    errors: []
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # -- PASSWORD SETUP --------------------------------------------------------
  /auth/password-reset/inspect:
    post:
      operationId: inspectPasswordResetLink
      summary: Inspeccionar enlace de configuración de contraseña sin consumirlo
      description: |
        Verifica si un enlace es válido y devuelve su propósito para que el frontend
        pueda presentar el formulario adecuado.

        **Propósitos del enlace:**
        - `INITIAL_SETUP`: primera configuración de contraseña del administrador inicial. Es el único propósito soportado y habilitado en esta versión.
        - `PASSWORD_RESET`: recuperación de contraseña posterior (HU-04.2); capacidad futura reservada en el esquema pero no habilitada en esta versión (un enlace con este propósito devolverá `422 RESET_LINK_INVALID`).

        El enlace **no** se consume al inspeccionarlo.
        Un enlace inválido, vencido, consumido o revocado devuelve `422 RESET_LINK_INVALID`.

        No expone datos del perfil del usuario ni de la organización.

        No requiere sesión activa (el usuario aún no tiene contraseña).
        **CSRF:** requiere `X-CSRF-TOKEN`.
      tags: [password-setup]
      security:
        - csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectLinkRequest"
      responses:
        "200":
          description: Enlace válido. Propósito devuelto para presentar el formulario.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectLinkResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/AccessDeniedOrCsrf"
        "422":
          description: Enlace inválido, vencido, consumido o revocado.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "/problems/reset-link-invalid"
                title: "Enlace no utilizable"
                status: 422
                detail: "El enlace ha vencido o ya fue utilizado."
                code: "RESET_LINK_INVALID"
                requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                errors: []
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/password-reset/complete:
    post:
      operationId: completePasswordSetup
      summary: Establecer contraseña mediante enlace y consumirlo
      description: |
        Establece la contraseña del usuario mediante el secreto contenido en el enlace
        y consume dicho enlace (un único uso).

        Válido únicamente para el propósito `INITIAL_SETUP` en esta versión. El propósito
        `PASSWORD_RESET` corresponde a la recuperación posterior (HU-04.2) y no está
        habilitado actualmente en este endpoint.

        Tras completar la operación:
        - El enlace queda invalidado.
        - Las sesiones anteriores del usuario quedan invalidadas.
        - El usuario debe iniciar sesión nuevamente.

        El secreto del enlace no queda registrado en auditoría ni en resultados
        de idempotencia (Nota 10, §7.5).

        **Respuesta incierta:** inspeccionar el enlace con `POST /auth/password-reset/inspect`.
        Si ya fue consumido, el operador debe emitir uno nuevo de forma consciente.

        No requiere sesión activa.
        **CSRF:** requiere `X-CSRF-TOKEN`.
      tags: [password-setup]
      security:
        - csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordSetupRequest"
      responses:
        "204":
          description: |
            Contraseña establecida y enlace consumido. Sin cuerpo de respuesta.
            Las sesiones anteriores del usuario quedan invalidadas.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/AccessDeniedOrCsrf"
        "422":
          description: Enlace inválido, vencido, consumido o revocado.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "/problems/reset-link-invalid"
                title: "Enlace no utilizable"
                status: 422
                detail: "El enlace ha vencido o ya fue utilizado."
                code: "RESET_LINK_INVALID"
                requestId: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
                errors: []
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # -- POSITIONS (HU-06) -----------------------------------------------------
  /positions:
    get:
      operationId: getPositions
      summary: Consultar catálogo de puestos de trabajo
      description: |
        Devuelve la lista de puestos de trabajo registrados en la organización a la que
        pertenece el usuario autenticado.

        **Actor:** Usuario empresarial autenticado con rol `ADMINISTRADOR` o `SUPERVISOR`.
        Usuarios con rol `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Aislamiento multi-tenant:** La organización se deriva exclusivamente de la sesión
        activa en el servidor. Nunca se recibe `organizationId` por el cliente.

        **Filtro por estado:** Mediante el parámetro opcional `active`:
        - Si se omite: devuelve todos los puestos (activos e inactivos).
        - `active=true`: solo puestos activos.
        - `active=false`: solo puestos inactivos.
        - Si se envía vacío, solo con espacios o con cualquier otro valor, responde `400 VALIDATION_FAILED`.
      tags: [positions]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PositionActiveQuery"
      responses:
        "200":
          description: Lista de puestos obtenida con éxito. Si no existen puestos, devuelve un arreglo vacío `[]`.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PositionResponse"
        "400":
          $ref: "#/components/responses/I21ValidationFailed"
        "401":
          $ref: "#/components/responses/I21SessionRequired"
        "403":
          $ref: "#/components/responses/I21AccessDeniedOrCsrf"
        "503":
          $ref: "#/components/responses/I21ServiceUnavailable"

    post:
      operationId: createPosition
      summary: Crear un puesto de trabajo
      description: |
        Registra un nuevo puesto de trabajo en la organización del usuario autenticado.
        El nuevo puesto se crea inicialmente en estado activo (`isActive: true`) con `lockVersion: 0`.

        **Actor:** Requiere rol `ADMINISTRADOR`. Roles `SUPERVISOR` y `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Seguridad:** Requiere cookie de sesión activa y token CSRF en `X-CSRF-TOKEN`.
        **Idempotencia:** Requiere cabecera `Idempotency-Key` (UUID). Ejecución coordinada
        mediante `BusinessIdempotentOperationExecutor`. Replays deterministas devuelven
        la respuesta original con la cabecera `Idempotency-Replayed: true` (el replay exitoso
        no incluye cabecera `X-Request-ID`; las respuestas Problem Details incluyen un `requestId` fresco).

        **Reglas de validación:**
        - `code`: obligatorio, normalizado a mayúsculas, alfanumérico con guiones (`^[A-Z0-9-]+$`), entre 2 y 32 caracteres.
          Debe ser único en la organización. Si ya existe, responde `409 POSITION_CODE_ALREADY_EXISTS`.
        - `name`: obligatorio, texto limpio no vacío, máximo 100 caracteres.
        - No se acepta `organizationId` ni `actorUserId`; se derivan del servidor.
      tags: [positions]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/CsrfTokenHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePositionRequest"
      responses:
        "201":
          description: Puesto de trabajo creado exitosamente.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionResponse"
        "400":
          $ref: "#/components/responses/I21ValidationFailed"
        "401":
          $ref: "#/components/responses/I21SessionRequired"
        "403":
          $ref: "#/components/responses/I21AccessDeniedOrCsrf"
        "409":
          $ref: "#/components/responses/PositionCreationConflict"
        "503":
          $ref: "#/components/responses/I21ServiceUnavailable"

  /positions/{positionId}:
    put:
      operationId: updatePosition
      summary: Actualizar nombre de un puesto de trabajo
      description: |
        Actualiza el nombre descriptivo de un puesto existente dentro de la organización.
        El código del puesto (`code`) es inmutable y no se modifica tras la creación.

        **Actor:** Requiere rol `ADMINISTRADOR`. Roles `SUPERVISOR` y `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Seguridad:** Requiere cookie de sesión activa y token CSRF en `X-CSRF-TOKEN`.
        **Idempotencia:** Requiere cabecera `Idempotency-Key` (UUID). Replays deterministas retornan
        `Idempotency-Replayed: true`.

        **Control de concurrencia optimista:** Requiere `expectedLockVersion` (mayor o igual a 0).
        Si la versión enviada no coincide con la versión actual en la base de datos,
        la operación se rechaza con `409 CONCURRENT_MODIFICATION`.
        Tras una actualización exitosa, el `lockVersion` del puesto se incrementa en 1.

        **Puesto no encontrado:** Si el `positionId` no existe o no pertenece a la organización
        del usuario autenticado, responde `404 POSITION_NOT_FOUND`.
      tags: [positions]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/PositionIdPath"
        - $ref: "#/components/parameters/CsrfTokenHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePositionRequest"
      responses:
        "200":
          description: Puesto de trabajo actualizado exitosamente.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionResponse"
        "400":
          $ref: "#/components/responses/I21ValidationFailed"
        "401":
          $ref: "#/components/responses/I21SessionRequired"
        "403":
          $ref: "#/components/responses/I21AccessDeniedOrCsrf"
        "404":
          $ref: "#/components/responses/PositionNotFound"
        "409":
          $ref: "#/components/responses/PositionMutationConflict"
        "503":
          $ref: "#/components/responses/I21ServiceUnavailable"

  /positions/{positionId}/status:
    patch:
      operationId: changePositionStatus
      summary: Activar o desactivar un puesto de trabajo
      description: |
        Cambia el estado de activación (`isActive`) de un puesto de trabajo existente.

        **Actor:** Requiere rol `ADMINISTRADOR`. Roles `SUPERVISOR` y `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Seguridad:** Requiere cookie de sesión activa y token CSRF en `X-CSRF-TOKEN`.
        **Idempotencia:** Requiere cabecera `Idempotency-Key` (UUID). Replays deterministas retornan
        `Idempotency-Replayed: true`.

        **Control de concurrencia optimista:** Requiere `expectedLockVersion` (mayor o igual a 0).
        Si la versión enviada no coincide con la versión actual, responde `409 CONCURRENT_MODIFICATION`.
        Tras una actualización exitosa, el `lockVersion` del puesto se incrementa en 1.

        **Puesto no encontrado:** Si el `positionId` no existe o no pertenece a la organización,
        responde `404 POSITION_NOT_FOUND`.
      tags: [positions]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/PositionIdPath"
        - $ref: "#/components/parameters/CsrfTokenHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePositionStatusRequest"
      responses:
        "200":
          description: Estado del puesto actualizado exitosamente.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
            Idempotency-Replayed:
              $ref: "#/components/headers/Idempotency-Replayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionResponse"
        "400":
          $ref: "#/components/responses/I21ValidationFailed"
        "401":
          $ref: "#/components/responses/I21SessionRequired"
        "403":
          $ref: "#/components/responses/I21AccessDeniedOrCsrf"
        "404":
          $ref: "#/components/responses/PositionNotFound"
        "409":
          $ref: "#/components/responses/PositionMutationConflict"
        "503":
          $ref: "#/components/responses/I21ServiceUnavailable"

  # -- ORGANIZATION CONFIGURATION (HU-05) -------------------------------------
  /organization/configuration:
    get:
      operationId: getOrganizationConfiguration
      summary: Consultar configuración de la organización y su sede activa
      description: |
        Devuelve la configuración general de la organización y los datos de su sede única activa.

        **Actor:** Usuario empresarial autenticado con rol `ADMINISTRADOR` o `SUPERVISOR`.
        Usuarios con rol `COLABORADOR` reciben `403 ACCESS_DENIED`.


        Calcula la diferencia numérica (`delta`) respecto a la versión actual y genera la huella
        canónica `validationFingerprint` requerida para la posterior activación.

        **Actor:** Requiere rol `ADMINISTRADOR`. Roles `SUPERVISOR` y `COLABORADOR` reciben `403 ACCESS_DENIED`.

        **Seguridad:** Requiere cookie de sesión activa y token CSRF en cabecera `X-CSRF-TOKEN`.
        Sin `Idempotency-Key` (es una evaluación sin efectos colaterales persistidos).

        **Control de estado base:** El campo `expectedCurrentPolicyVersionId` es obligatorio.
        Si la organización no tiene política previa, debe enviarse explícitamente `null`.
        Si no coincide con la versión vigente en el momento de la evaluación, responde
